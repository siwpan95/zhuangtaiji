name: selfcheck

# 本仓的最小 CI：clean clone → 装依赖 → 跑本仓自带的无头自检。
# 由 allin 仓 tools/publish_area_ci.py 生成（2026-11-21）；入口与依赖取自本仓自身事实。
# 钉 Python 3.11：3.13 移除了 audioop，pydub 等音频依赖在 3.13 上导入即失败。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 无头自检
        run: |
          set -o pipefail
          python -u selfcheck.py 2>&1 | tee "$RUNNER_TEMP/selfcheck.log"
        env:
          PYTHONIOENCODING: utf-8
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      # 失败时把真实报错暴露到 annotation 与 job summary：
      # job 原始日志需 admin 权限才能经 API 读取，公开可读的只有 annotation。
      - name: 失败原因
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/selfcheck.log"
          TAIL=$(tail -6 "$LOG" 2>/dev/null | tr '\n' ' ' | tr -d '\r' | cut -c1-800)
          echo "::error title=selfcheck 失败::$TAIL"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo '### selfcheck 失败输出（末 40 行）'
              echo '```'
              tail -40 "$LOG" 2>/dev/null || echo '(无日志)'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
